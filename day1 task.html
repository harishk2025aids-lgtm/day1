
<!DOCTYPE html>
<html>
<head>
    <title>My Landing Page</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 100px;
            background-color: lightblue;
            transition: 0.5s;
        }

        h1 {
            color: black;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <p>This is my first landing page.</p>

    <button onclick="changeColor()">Change Background</button>

    <script>

        let colors = [
            "lightgreen",
            "lightpink",
            "yellow",
            "lightblue",
            "orange",
            "violet"
        ];

        let i = 0;

        function changeColor() {

            document.body.style.backgroundColor = colors[i];

            i++;

            if (i == colors.length) {
                i = 0;
            }

        }

    </script>

</body>
</html>
